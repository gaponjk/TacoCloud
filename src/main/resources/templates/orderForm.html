<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Taco Cloud</title>
    <link rel="stylesheet" th:href="@{/styles.css}"/>
</head>
<body>
<form method="POST" th:action="@{/orders}" th:object="${tacoOrder}">
    <h1>Order your creations!</h1>

    <img alt="Taco png logo" th:src="@{/images/TacoCloud.png}"/>

    <h3>Your tacos in this order:</h3>
    <a id="another" th:href="@{/design}">Design another taco</a>
    <ul>
        <li th:each="taco : *{tacos}">
            <span th:text="${taco.name}">taco name</span><br/>
        </li>
    </ul>

    <h3>Deliver my taco masterpieces to...</h3>
    <label>Name:
        <input th:field="*{deliveryName}" type="text"/>
        <span class="validationError"
              th:errors="*{deliveryName}"
              th:if="${#fields.hasErrors('deliveryName')}">Delivery Name Error</span>
    </label><br/>

    <label>City name:
        <input th:field="*{deliveryCity}" type="text"/>
        <span class="validationError"
              th:errors="*{deliveryCity}"
              th:if="${#fields.hasErrors('deliveryCity')}">Delivery City Error</span>
    </label><br/>

    <label>State name:
        <input th:field="*{deliveryState}" type="text"/>
        <span class="validationError"
              th:errors="*{deliveryState}"
              th:if="${#fields.hasErrors('deliveryState')}">Delivery State Error</span>
    </label><br/>

    <label>Street address:
        <input th:field="*{deliveryStreet}" type="text"/>
        <span class="validationError"
              th:errors="*{deliveryStreet}"
              th:if="${#fields.hasErrors('deliveryStreet')}">Delivery Street Error</span>
    </label><br/>

    <label>Zip:
        <input th:field="*{deliveryZip}" type="text"/>
        <span class="validationError"
              th:errors="*{deliveryZip}"
              th:if="${#fields.hasErrors('deliveryZip')}">Delivery Zip Error</span>
    </label><br/>

    <h3>Here's how I'll pay...</h3>
    <label>Credit Card #:
        <input th:field="*{ccNumber}" type="text"/>
        <span class="validationError"
              th:errors="*{ccNumber}"
              th:if="${#fields.hasErrors('ccNumber')}">CC Num Error</span>
    </label><br/>

    <label>Expiration date:
        <input th:field="*{ccExpiration}" type="text"/>
        <span class="validationError"
              th:errors="*{ccExpiration}"
              th:if="${#fields.hasErrors('ccExpiration')}">CC Expiration Error</span>
    </label><br/>

    <label>CVV:
        <input th:field="*{ccCVV}" type="text"/>
        <span class="validationError"
              th:errors="*{ccCVV}"
              th:if="${#fields.hasErrors('ccCVV')}">CVV Error</span>
    </label><br/>
    <button type="submit">Submit order</button>
</form>
</body>
</html>
